name: CI

# Phase 2 — blocking mode. Typecheck, lint, and build now gate merges: a failure
# fails the job (continue-on-error removed). The tree is type- and lint-clean, so
# the first blocking run is green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      # Phase S #6 — dependency audit. `yarn audit` exits with a severity bitmask
      # (1 info, 2 low, 4 moderate, 8 high, 16 critical) rather than a plain 0/1,
      # and --level only filters the report, not the code — so mask for high|critical
      # (8|16 = 24) and let moderate-and-below through as advisory output.
      - name: Dependency audit (high + critical)
        run: |
          code=0
          yarn audit --groups dependencies || code=$?
          if [ $(( code & 24 )) -ne 0 ]; then
            echo "::error::high or critical vulnerabilities in dependencies — upgrade or add a resolution"
            exit 1
          fi
          echo "No high/critical vulnerabilities."

      # `yarn build` runs with NODE_ENV=production, where lib/env.ts requires a
      # valid NEXT_PUBLIC_API_BASE_URL — by design, so a deploy can't silently
      # ship pointing at localhost. CI only compiles, it never calls the backend,
      # so fall back to a placeholder URL when the secret isn't configured.
      # Real deploys must set the real value in their own environment.
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.invalid' }}
